# Render Blueprint — optional one-click deploy
services:
  - type: web
    name: wifi-voucher-mvp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: TRIAL_DAYS
        value: "14"
      - key: SUBSCRIPTION_PRICE_UGX
        sync: false
      - key: SUBSCRIPTION_PERIOD_DAYS
        value: "30"
      - key: MOMO_SMS_WEBHOOK_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: BUSINESS_EMAIL
        sync: false
      - key: MOMO_MTN_MERCHANT_NUMBER
        sync: false
      - key: MOMO_AIRTEL_MERCHANT_NUMBER
        sync: false
      - key: PESAPAL_ENV
        value: live
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_IPN_ID
        sync: false
      - key: PESAPAL_CALLBACK_URL
        sync: false
